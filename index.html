<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definitieve Applicatie - Prachtige Klok</title>
<style>
    :root {
        --bg-color: #0a0e27;
        --panel-bg: #141a3a;
        --border-color: #232a55;
        --text-color: #e8e8f0;
        --muted: #7a82a8;
        --accent-color: #f4c542;
        --highlight: #ff6f91;
        --cyan: #4dd0e1;
        --success: #4caf50;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: radial-gradient(ellipse at top, #1a2150 0%, var(--bg-color) 70%);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
        padding-bottom: 80px;
    }

    nav {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        background: var(--panel-bg);
        padding: 10px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        flex-wrap: wrap;
        justify-content: center;
    }

    .tab-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 12px 24px;
        font-size: 1.1rem;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .tab-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-color);
    }

    .tab-btn.active {
        background: var(--accent-color);
        color: var(--bg-color);
    }

    .tab-content {
        display: none;
        width: 100%;
        max-width: 1200px;
        justify-content: center;
        align-items: flex-start;
        animation: fadeIn 0.4s;
    }

    .tab-content.active {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        width: 100%;
    }

    .panel h2 {
        color: var(--accent-color);
        margin-bottom: 20px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
    }

    .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        width: 100%;
    }

    @media (max-width: 850px) {
        .split-layout {
            grid-template-columns: 1fr;
        }
    }

    /* ================= KLOK (nieuw SVG ontwerp) ================= */
    .clock-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    svg.clock {
        width: 100%;
        max-width: 320px;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 25px rgba(244,197,66,0.15));
    }

    .clock-info {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
    }
    .clock-info b {
        color: var(--accent-color);
        font-variant-numeric: tabular-nums;
    }
    .metric-label {
        font-size: 9px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
        text-align: center;
    }
    .metric-value {
        font-size: 28px;
        font-weight: 200;
        line-height: 1;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        text-align: center;
    }

    /* ================= 100-JARIGE CYCLUS ================= */
    .cycle-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
        width: 100%;
    }
    .year-box {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 5px;
        border-radius: 6px;
        font-size: 0.95rem;
        border: 1px solid transparent;
        text-align: center;
        font-weight: 500;
        transition: all 0.2s;
        color: var(--text-color);
    }
    .year-box:hover {
        background: rgba(244, 197, 66, 0.15);
        border-color: var(--accent-color);
        color: var(--accent-color);
    }

    /* ================= TOOLS ================= */
    .stopwatch-display {
        font-size: 3.5rem;
        font-weight: 200;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        margin-bottom: 20px;
        font-family: monospace;
        text-align: center;
    }
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s;
    }
    button:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
    }
    button.primary {
        background: var(--accent-color);
        color: var(--bg-color);
        border-color: var(--accent-color);
    }
    button.danger {
        border-color: var(--highlight);
        color: var(--highlight);
    }
    button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    .input-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }
    .input-group input {
        padding: 12px;
        font-size: 1.2rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        width: 120px;
        text-align: center;
    }
    .beep-status {
        font-size: 1.3rem;
        font-weight: bold;
        margin-top: 20px;
        color: var(--accent-color);
        min-height: 30px;
        text-align: center;
    }

    /* ================= AGENDA & KLUIS ================= */
    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .calendar-header h3 {
        color: var(--accent-color);
        font-size: 1.3rem;
    }
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        text-align: center;
    }
    .day-name {
        font-weight: bold;
        color: var(--border-color);
        padding: 8px 0;
        font-size: 0.9rem;
    }
    .calendar-day {
        padding: 12px 5px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
        font-size: 0.9rem;
    }
    .calendar-day:hover {
        background: rgba(244, 197, 66, 0.1);
    }
    .calendar-day.selected {
        background: var(--accent-color);
        color: var(--bg-color);
        font-weight: bold;
        border-color: var(--accent-color);
    }
    .calendar-day.today {
        border-color: var(--highlight);
    }
    .events-section {
        margin-top: 25px;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
    }
    .events-section h3 {
        margin-bottom: 15px;
        color: var(--text-color);
        font-size: 1.1rem;
    }
    .event-list {
        list-style: none;
        margin-bottom: 20px;
        max-height: 200px;
        overflow-y: auto;
    }
    .event-list li {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .event-list li button {
        background: var(--highlight);
        border: none;
        color: white;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
    }
    .event-input-group {
        display: flex;
        gap: 10px;
    }
    .event-input-group input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
    }
    .vault-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 25px;
        background: rgba(0,0,0,0.2);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid rgba(59, 75, 110, 0.5);
    }
    .vault-form input {
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        width: 100%;
    }
    .vault-list {
        list-style: none;
    }
    .vault-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--accent-color);
    }
    .vault-info {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .vault-title {
        font-weight: bold;
        color: var(--accent-color);
    }
    .vault-secret {
        font-family: monospace;
        letter-spacing: 2px;
        color: var(--text-color);
    }
    .vault-actions {
        display: flex;
        gap: 8px;
    }
    .vault-actions button {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.85rem;
    }
    .vault-actions button:hover {
        background: var(--border-color);
    }
</style>
</head>
<body>

    <!-- Vier Volle Delen Navigatie -->
    <nav>
        <button class="tab-btn active" onclick="openTab(event, 'clock-tab')">Klok</button>
        <button class="tab-btn" onclick="openTab(event, 'cycle-tab')">100-Jarige Cyclus</button>
        <button class="tab-btn" onclick="openTab(event, 'tools-tab')">Stopwatch & Biep</button>
        <button class="tab-btn" onclick="openTab(event, 'agenda-tab')">Agenda & Kluis</button>
    </nav>

    <!-- DEEL 1: KLOK (nieuw ontwerp) -->
    <section id="clock-tab" class="tab-content active">
        <div class="clock-wrapper">
            <svg class="clock" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="95" fill="none" stroke="#232a55" stroke-width="1"/>
                <path d="M 100 100 m -70 0 A 70 70 0 0 1 100 30 L 100 100 Z" fill="rgba(244,197,66,0.08)"/>
                <path d="M 100 100 m -70 0 A 70 70 0 0 0 100 170 L 100 100 Z" fill="rgba(77,208,225,0.08)"/>
                <g id="clock-ticks"></g>
                <circle cx="100" cy="100" r="3" fill="var(--accent-color)"/>
                <line id="clock-hand" x1="100" y1="100" x2="100" y2="26" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round"/>
                <circle id="clock-tip" cx="100" cy="26" r="4" fill="var(--accent-color)"/>
            </svg>
            <div class="clock-info">
                <div>
                    <div class="metric-label">Uur</div>
                    <div class="metric-value" id="clock-hour">0</div>
                </div>
                <div>
                    <div class="metric-label">Minuut</div>
                    <div class="metric-value" id="clock-minute">0</div>
                </div>
                <div>
                    <div class="metric-label">Seconde</div>
                    <div class="metric-value" id="clock-second">0</div>
                </div>
            </div>
        </div>
    </section>

    <!-- DEEL 2: 100-JARIGE CYCLUS -->
    <section id="cycle-tab" class="tab-content">
        <div class="panel">
            <h2>100-Jarige Cyclus (2000 - 2099)</h2>
            <div class="cycle-grid" id="cycleGrid"></div>
        </div>
    </section>

    <!-- DEEL 3: TOOLS (STOPWATCH & BIEPSECTIE) -->
    <section id="tools-tab" class="tab-content">
        <div class="split-layout">
            <div class="panel">
                <h2>Stopwatch</h2>
                <div class="stopwatch-display" id="swDisplay">00:00:00</div>
                <div class="btn-group">
                    <button class="primary" id="swStart" onclick="startStopwatch()">Start</button>
                    <button id="swStop" onclick="stopStopwatch()" disabled>Stop</button>
                    <button class="danger" onclick="resetStopwatch()">Reset</button>
                </div>
            </div>
            <div class="panel">
                <h2>Biepsectie</h2>
                <div class="input-group">
                    <input type="number" id="beepTime" value="5" min="1">
                    <button class="primary" onclick="startBeep()">Start Timer</button>
                </div>
                <div class="beep-status" id="beepStatus">Gereed.</div>
            </div>
        </div>
    </section>

    <!-- DEEL 4: AGENDA & KLUIS -->
    <section id="agenda-tab" class="tab-content">
        <div class="split-layout">
            <div class="panel">
                <div class="calendar-header">
                    <h3 id="monthYearDisplay">Maand</h3>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="events-section">
                    <h3 id="selectedDateDisplay">Selecteer een dag</h3>
                    <ul class="event-list" id="eventList"></ul>
                    <div class="event-input-group">
                        <input type="text" id="eventInput" placeholder="Nieuwe afspraak...">
                        <button class="primary" onclick="addEvent()" style="padding: 10px 15px;">+</button>
                    </div>
                </div>
            </div>
            <div class="panel">
                <h2>Beveiligde Kluis</h2>
                <div class="vault-form">
                    <input type="text" id="vaultTitle" placeholder="Titel (bijv. Gmail, Wallet)">
                    <input type="password" id="vaultSecret" placeholder="Wachtwoord / Sleutel">
                    <button class="primary" onclick="addVaultItem()">Opslaan in Kluis</button>
                </div>
                <ul class="vault-list" id="vaultList"></ul>
            </div>
        </div>
    </section>

<script>
    /* ================= TAB LOGICA ================= */
    function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        document.getElementById(tabName).style.display = "flex";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    /* ================= KLOK (SVG + real-time) ================= */
    const svgNS = "http://www.w3.org/2000/svg";
    function el(tag, attrs) {
        const e = document.createElementNS(svgNS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
    }
    const ticks = document.getElementById("clock-ticks");
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
        ticks.appendChild(el("line", {
            x1: 100 + Math.cos(a) * 78, y1: 100 + Math.sin(a) * 78,
            x2: 100 + Math.cos(a) * 90, y2: 100 + Math.sin(a) * 90,
            stroke: i === 0 ? "var(--accent-color)" : "#2a3160", "stroke-width": i === 0 ? 3 : 1.5,
        }));
        const t = el("text", {
            x: 100 + Math.cos(a) * 66, y: 100 + Math.sin(a) * 66 + 3,
            "text-anchor": "middle", "font-size": 9, fill: "#7a82a8",
        });
        t.textContent = i + 1; ticks.appendChild(t);
    }

    function updateClockReal() {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const hr = hours + minutes / 60 + seconds / 3600;
        const angle = (hr / 12) * 360;

        document.getElementById("clock-hand").setAttribute("transform", `rotate(${angle} 100 100)`);
        document.getElementById("clock-tip").setAttribute("transform", `rotate(${angle} 100 100)`);
        
        document.getElementById("clock-hour").textContent = now.getHours();
        document.getElementById("clock-minute").textContent = String(minutes).padStart(2, '0');
        document.getElementById("clock-second").textContent = String(seconds).padStart(2, '0');
    }
    updateClockReal();
    setInterval(updateClockReal, 1000);

    /* ================= 100-JARIGE CYCLUS ================= */
    const cycleGrid = document.getElementById('cycleGrid');
    for (let year = 2000; year <= 2099; year++) {
        const yearBox = document.createElement('div');
        yearBox.className = 'year-box';
        yearBox.textContent = year;
        cycleGrid.appendChild(yearBox);
    }

    /* ================= STOPWATCH ================= */
    let swInterval = null;
    let swTime = 0;
    let swRunning = false;

    function formatStopwatch(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const hundredths = Math.floor((ms % 1000) / 10);
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(hundredths).padStart(2, '0')}`;
    }

    function startStopwatch() {
        if (swRunning) return;
        swRunning = true;
        document.getElementById('swStart').disabled = true;
        document.getElementById('swStop').disabled = false;
        const startTime = Date.now() - swTime;
        swInterval = setInterval(() => {
            swTime = Date.now() - startTime;
            document.getElementById('swDisplay').textContent = formatStopwatch(swTime);
        }, 10);
    }

    function stopStopwatch() {
        swRunning = false;
        clearInterval(swInterval);
        document.getElementById('swStart').disabled = false;
        document.getElementById('swStop').disabled = true;
    }

    function resetStopwatch() {
        stopStopwatch();
        swTime = 0;
        document.getElementById('swDisplay').textContent = formatStopwatch(0);
    }

    /* ================= BIEPSECTIE ================= */
    let beepTimeout = null;
    let audioCtx = null;

    function playBeep() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    }

    function startBeep() {
        const timeInput = document.getElementById('beepTime').value;
        const status = document.getElementById('beepStatus');
        const seconds = parseInt(timeInput);
        if (isNaN(seconds) || seconds < 1) {
            status.textContent = "Voer een geldig getal in!";
            return;
        }
        if (beepTimeout) clearTimeout(beepTimeout);
        status.textContent = `Timer gestart voor ${seconds} seconden...`;
        beepTimeout = setTimeout(() => {
            status.textContent = "BIEP! Tijd is om.";
            playBeep();
            setTimeout(playBeep, 600);
            setTimeout(playBeep, 1200);
        }, seconds * 1000);
    }

    /* ================= AGENDA ================= */
    let currentDate = new Date();
    let selectedDate = new Date();
    let events = JSON.parse(localStorage.getItem('agendaEvents')) || {};

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
        document.getElementById('monthYearDisplay').textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const dayNames = ["Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"];
        dayNames.forEach(day => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = day;
            grid.appendChild(el);
        });

        for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const el = document.createElement('div');
            el.className = 'calendar-day';
            el.textContent = day;
            
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear()) {
                el.classList.add('today');
            }
            if (dateStr === selectedDate.toISOString().split('T')[0]) {
                el.classList.add('selected');
            }

            el.onclick = () => {
                selectedDate = new Date(year, month, day);
                renderCalendar();
                renderEvents();
            };
            grid.appendChild(el);
        }
    }

    function renderEvents() {
        const dateStr = selectedDate.toISOString().split('T')[0];
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        
        const displayStr = selectedDate.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('selectedDateDisplay').textContent = displayStr;

        if (events[dateStr] && events[dateStr].length > 0) {
            events[dateStr].forEach((eventText, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${eventText}</span> <button onclick="removeEvent('${dateStr}', ${index})">X</button>`;
                list.appendChild(li);
            });
        } else {
            list.innerHTML = '<li style="color: #666; background: transparent; justify-content: center; border: none;">Geen afspraken</li>';
        }
    }

    function addEvent() {
        const input = document.getElementById('eventInput');
        const text = input.value.trim();
        if (!text) return;
        const dateStr = selectedDate.toISOString().split('T')[0];
        if (!events[dateStr]) events[dateStr] = [];
        events[dateStr].push(text);
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        input.value = '';
        renderEvents();
    }

    function removeEvent(dateStr, index) {
        events[dateStr].splice(index, 1);
        if (events[dateStr].length === 0) delete events[dateStr];
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        renderEvents();
    }

    renderCalendar();
    renderEvents();

    /* ================= KLUIS ================= */
    let vaultItems = JSON.parse(localStorage.getItem('vaultData')) || [];

    function renderVault() {
        const list = document.getElementById('vaultList');
        list.innerHTML = '';
        
        if (vaultItems.length === 0) {
            list.innerHTML = '<li style="text-align: center; color: #666; background: transparent; border: none;">De kluis is leeg.</li>';
            return;
        }

        vaultItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'vault-item';
            const isVisible = item.visible ? item.secret : '••••••••••••';
            
            li.innerHTML = `
                <div class="vault-info">
                    <span class="vault-title">${item.title}</span>
                    <span class="vault-secret" id="secret-${index}">${isVisible}</span>
                </div>
                <div class="vault-actions">
                    <button onclick="toggleSecret(${index})">${item.visible ? 'Verberg' : 'Toon'}</button>
                    <button onclick="copySecret(${index})">Kopieer</button>
                    <button onclick="deleteVaultItem(${index})" style="color: var(--highlight); border-color: var(--highlight);">Verwijder</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function addVaultItem() {
        const titleInput = document.getElementById('vaultTitle');
        const secretInput = document.getElementById('vaultSecret');
        const title = titleInput.value.trim();
        const secret = secretInput.value.trim();
        
        if (!title || !secret) {
            alert('Vul zowel een titel als een geheim in.');
            return;
        }
        vaultItems.push({ title, secret, visible: false });
        localStorage.setItem('vaultData', JSON.stringify(vaultItems));
        titleInput.value = '';
        secretInput.value = '';
        renderVault();
    }

    function toggleSecret(index) {
        vaultItems[index].visible = !vaultItems[index].visible;
        renderVault();
    }

    function copySecret(index) {
        navigator.clipboard.writeText(vaultItems[index].secret).then(() => {
            alert('Geheim gekopieerd naar klembord!');
        });
    }

    function deleteVaultItem(index) {
        if(confirm('Weet je zeker dat je dit item wilt verwijderen?')) {
            vaultItems.splice(index, 1);
            localStorage.setItem('vaultData', JSON.stringify(vaultItems));
            renderVault();
        }
    }

    renderVault();
</script>

</body>
</html>
