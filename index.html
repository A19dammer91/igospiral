<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definitieve Applicatie - 6 Tabbladen</title>
<style>
    :root {
        --bg-color: #0a0e27;
        --panel-bg: #141a3a;
        --border-color: #232a55;
        --text-color: #e8e8f0;
        --muted: #7a82a8;
        --accent-color: #f4c542;
        --highlight: #ff6f91;
        --cyan: #4dd0e1;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: radial-gradient(ellipse at top, #1a2150 0%, var(--bg-color) 70%);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
        padding-bottom: 80px;
    }

    nav {
        display: flex;
        gap: 6px;
        margin-bottom: 30px;
        background: var(--panel-bg);
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        flex-wrap: wrap;
        justify-content: center;
    }

    .tab-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 8px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    .tab-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-color);
    }

    .tab-btn.active {
        background: var(--accent-color);
        color: var(--bg-color);
    }

    .tab-content {
        display: none;
        width: 100%;
        max-width: 1000px;
        justify-content: center;
        align-items: flex-start;
        animation: fadeIn 0.4s;
    }

    .tab-content.active {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        width: 100%;
        margin-bottom: 20px;
    }

    .panel h2 {
        color: var(--muted);
        margin-bottom: 20px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* ================= KLOK (alleen wijzerplaat) ================= */
    .clock-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    svg.clock {
        width: 100%;
        max-width: 320px;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 25px rgba(244,197,66,0.15));
    }

    /* ================= BIJECTIE ================= */
    .bijection-layout {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
    }

    .bijection-left {
        flex: 1;
        min-width: 280px;
    }

    .bijection-right {
        flex: 1;
        min-width: 280px;
    }

    .metric {
        text-align: center;
        margin-bottom: 18px;
    }
    .metric-label {
        font-size: 9px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
    }
    .metric-value {
        font-size: 28px;
        font-weight: 200;
        line-height: 1;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
    }
    .metric-value.gold {
        color: var(--accent-color);
    }

    .tuple {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 15px;
    }
    .tuple > div {
        background: rgba(255,255,255,0.05);
        border-radius: 6px;
        padding: 8px 2px;
        text-align: center;
    }
    .tuple .val {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-color);
        font-variant-numeric: tabular-nums;
    }
    .tuple .lbl {
        font-size: 7px;
        letter-spacing: 1px;
        color: var(--muted);
        text-transform: uppercase;
        margin-top: 2px;
    }

    .spiral-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    .spiral-controls select {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 12px;
    }
    #spiral-canvas {
        width: 100%;
        height: 250px;
        display: block;
        cursor: grab;
        background: rgba(10,14,39,0.5);
        border-radius: 10px;
        touch-action: none;
    }
    #spiral-canvas:active {
        cursor: grabbing;
    }
    .spiral-info {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
    }
    .spiral-info b {
        color: var(--accent-color);
        font-variant-numeric: tabular-nums;
    }

    .slider-container {
        margin-top: 20px;
    }
    .slider-container input[type=range] {
        width: 100%;
        accent-color: var(--accent-color);
        margin: 8px 0;
    }
    .slider-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
    }

    /* ================= 100-JARIGE CYCLUS ================= */
    .cycle-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
        width: 100%;
    }
    .year-box {
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 5px;
        border-radius: 6px;
        font-size: 0.95rem;
        border: 1px solid transparent;
        text-align: center;
        font-weight: 500;
        transition: all 0.2s;
        color: var(--text-color);
    }
    .year-box:hover {
        background: rgba(244, 197, 66, 0.15);
        border-color: var(--accent-color);
        color: var(--accent-color);
    }

    /* ================= STOPWATCH ================= */
    .stopwatch-display {
        font-size: 4rem;
        font-weight: 200;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        margin-bottom: 20px;
        font-family: monospace;
        text-align: center;
    }
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    button {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 10px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s;
    }
    button:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
    }
    button.primary {
        background: var(--accent-color);
        color: var(--bg-color);
        border-color: var(--accent-color);
    }
    button.danger {
        border-color: var(--highlight);
        color: var(--highlight);
    }
    button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    /* ================= AGENDA ================= */
    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .calendar-header h3 {
        color: var(--accent-color);
        font-size: 1.3rem;
    }
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        text-align: center;
    }
    .day-name {
        font-weight: bold;
        color: var(--border-color);
        padding: 8px 0;
        font-size: 0.9rem;
    }
    .calendar-day {
        padding: 12px 5px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
        font-size: 0.9rem;
    }
    .calendar-day:hover {
        background: rgba(244, 197, 66, 0.1);
    }
    .calendar-day.selected {
        background: var(--accent-color);
        color: var(--bg-color);
        font-weight: bold;
        border-color: var(--accent-color);
    }
    .calendar-day.today {
        border-color: var(--highlight);
    }
    .events-section {
        margin-top: 25px;
        border-top: 1px solid var(--border-color);
        padding-top: 20px;
    }
    .events-section h3 {
        margin-bottom: 15px;
        color: var(--text-color);
        font-size: 1.1rem;
    }
    .event-list {
        list-style: none;
        margin-bottom: 20px;
        max-height: 200px;
        overflow-y: auto;
    }
    .event-list li {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .event-list li button {
        background: var(--highlight);
        border: none;
        color: white;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
    }
    .event-input-group {
        display: flex;
        gap: 10px;
    }
    .event-input-group input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
    }

    /* ================= KLUIS ================= */
    .vault-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 25px;
        background: rgba(0,0,0,0.2);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid rgba(59, 75, 110, 0.5);
    }
    .vault-form input {
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        width: 100%;
    }
    .vault-list {
        list-style: none;
    }
    .vault-item {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--accent-color);
    }
    .vault-info {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .vault-title {
        font-weight: bold;
        color: var(--accent-color);
    }
    .vault-secret {
        font-family: monospace;
        letter-spacing: 2px;
        color: var(--text-color);
    }
    .vault-actions {
        display: flex;
        gap: 8px;
    }
    .vault-actions button {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.85rem;
    }
    .vault-actions button:hover {
        background: var(--border-color);
    }
</style>
</head>
<body>

    <nav>
        <button class="tab-btn active" onclick="openTab(event, 'clock-tab')">Klok</button>
        <button class="tab-btn" onclick="openTab(event, 'bijection-tab')">Bijectie</button>
        <button class="tab-btn" onclick="openTab(event, 'cycle-tab')">100-Jarige Cyclus</button>
        <button class="tab-btn" onclick="openTab(event, 'stopwatch-tab')">Stopwatch</button>
        <button class="tab-btn" onclick="openTab(event, 'agenda-tab')">Agenda</button>
        <button class="tab-btn" onclick="openTab(event, 'vault-tab')">Kluis</button>
    </nav>

    <!-- TAB 1: KLOK (alleen wijzerplaat) -->
    <section id="clock-tab" class="tab-content active">
        <div class="panel">
            <div class="clock-wrapper">
                <svg class="clock" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="95" fill="none" stroke="#232a55" stroke-width="1"/>
                    <path d="M 100 100 m -70 0 A 70 70 0 0 1 100 30 L 100 100 Z" fill="rgba(244,197,66,0.08)"/>
                    <path d="M 100 100 m -70 0 A 70 70 0 0 0 100 170 L 100 100 Z" fill="rgba(77,208,225,0.08)"/>
                    <g id="clock-ticks"></g>
                    <circle cx="100" cy="100" r="3" fill="var(--accent-color)"/>
                    <line id="clock-hand" x1="100" y1="100" x2="100" y2="26" stroke="var(--accent-color)" stroke-width="3" stroke-linecap="round"/>
                    <circle id="clock-tip" cx="100" cy="26" r="4" fill="var(--accent-color)"/>
                </svg>
            </div>
        </div>
    </section>

    <!-- TAB 2: BIJECTIE -->
    <section id="bijection-tab" class="tab-content">
        <div class="panel">
            <div class="bijection-layout">
                <div class="bijection-left">
                    <div class="metric">
                        <div class="metric-label">Paper-m (mod 12)</div>
                        <div class="metric-value gold" id="paper-m">0</div>
                        <div class="metric-label" id="paper-m-sub">0 rondjes van 12 uur</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Uur (1..24)</div>
                        <div class="metric-value" id="hour-pos">1</div>
                    </div>
                    <div class="tuple" id="tuple"></div>
                    <div class="slider-container">
                        <input type="range" id="bijection-slider" min="0" max="2520" value="0" step="1">
                        <div class="slider-labels"><span>dag 0</span><span>2.520</span></div>
                    </div>
                </div>
                <div class="bijection-right">
                    <div class="spiral-controls">
                        <select id="spiral-system">
                            <option value="7">Week · q = 7</option>
                            <option value="12">Klok · q = 12</option>
                            <option value="30">Maand · q = 30</option>
                            <option value="60">Minuut · q = 60</option>
                            <option value="9">(19, 9) · q = 9</option>
                        </select>
                        <button id="spiral-toggle">⏸ Rotatie</button>
                    </div>
                    <canvas id="spiral-canvas"></canvas>
                    <div class="spiral-info" id="spiral-info">
                        <span>Positie <b>1</b></span>
                        <span>m = <b>0</b></span>
                        <span>p = m·q + 1 = <b>1</b></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- TAB 3: 100-JARIGE CYCLUS -->
    <section id="cycle-tab" class="tab-content">
        <div class="panel">
            <h2>100-Jarige Cyclus (2000 - 2099)</h2>
            <div class="cycle-grid" id="cycleGrid"></div>
        </div>
    </section>

    <!-- TAB 4: STOPWATCH -->
    <section id="stopwatch-tab" class="tab-content">
        <div class="panel">
            <h2>Stopwatch</h2>
            <div class="stopwatch-display" id="swDisplay">00:00:00</div>
            <div class="btn-group">
                <button class="primary" id="swStart" onclick="startStopwatch()">Start</button>
                <button id="swStop" onclick="stopStopwatch()" disabled>Stop</button>
                <button class="danger" onclick="resetStopwatch()">Reset</button>
            </div>
        </div>
    </section>

    <!-- TAB 5: AGENDA -->
    <section id="agenda-tab" class="tab-content">
        <div class="panel">
            <div class="calendar-header">
                <h3 id="monthYearDisplay">Maand</h3>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="events-section">
                <h3 id="selectedDateDisplay">Selecteer een dag</h3>
                <ul class="event-list" id="eventList"></ul>
                <div class="event-input-group">
                    <input type="text" id="eventInput" placeholder="Nieuwe afspraak...">
                    <button class="primary" onclick="addEvent()" style="padding: 10px 15px;">+</button>
                </div>
            </div>
        </div>
    </section>

    <!-- TAB 6: KLUIS -->
    <section id="vault-tab" class="tab-content">
        <div class="panel">
            <h2>Beveiligde Kluis</h2>
            <div class="vault-form">
                <input type="text" id="vaultTitle" placeholder="Titel (bijv. Gmail, Wallet)">
                <input type="password" id="vaultSecret" placeholder="Wachtwoord / Sleutel">
                <button class="primary" onclick="addVaultItem()">Opslaan in Kluis</button>
            </div>
            <ul class="vault-list" id="vaultList"></ul>
        </div>
    </section>

<script>
    /* ================= TAB LOGICA ================= */
    function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        document.getElementById(tabName).style.display = "flex";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
        // Zorg dat de spiraalcanvas goed formaat heeft als het tabblad actief wordt
        if (tabName === 'bijection-tab' && spiralObj) {
            setTimeout(() => spiralObj.resize(), 10);
        }
    }

    /* ================= KLOK (alleen wijzerplaat) ================= */
    const svgNS = "http://www.w3.org/2000/svg";
    function el(tag, attrs) {
        const e = document.createElementNS(svgNS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
    }
    const ticks = document.getElementById("clock-ticks");
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
        ticks.appendChild(el("line", {
            x1: 100 + Math.cos(a) * 78, y1: 100 + Math.sin(a) * 78,
            x2: 100 + Math.cos(a) * 90, y2: 100 + Math.sin(a) * 90,
            stroke: i === 0 ? "var(--accent-color)" : "#2a3160", "stroke-width": i === 0 ? 3 : 1.5,
        }));
        const t = el("text", {
            x: 100 + Math.cos(a) * 66, y: 100 + Math.sin(a) * 66 + 3,
            "text-anchor": "middle", "font-size": 9, fill: "#7a82a8",
        });
        t.textContent = i + 1; ticks.appendChild(t);
    }

    function updateClockReal() {
        const now = new Date();
        const hours = now.getHours() % 12;
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const hr = hours + minutes / 60 + seconds / 3600;
        const angle = (hr / 12) * 360;
        document.getElementById("clock-hand").setAttribute("transform", `rotate(${angle} 100 100)`);
        document.getElementById("clock-tip").setAttribute("transform", `rotate(${angle} 100 100)`);
    }
    updateClockReal();
    setInterval(updateClockReal, 1000);

    /* ================= BIJECTIE ================= */
    const UNITS = ["millennium","eeuw","decennium","jaar","maand","dag","uur","minuut","seconde","ms"];
    const BASES = {ms:1000n,seconde:60n,minuut:60n,uur:24n,dag:30n,
      maand:12n,jaar:10n,decennium:10n,eeuw:10n,millennium:null};
    const SMALL_TO_LARGE = [...UNITS].reverse();

    function spiral(value, q) {
      if (typeof value === "number" && !Number.isSafeInteger(value)) {
        throw new RangeError("value is te groot voor Number. Geef een BigInt.");
      }
      const v = BigInt(value), base = BigInt(q);
      if (v < 1n) throw new Error("value begint bij 1");
      return { position: Number(((v - 1n) % base) + 1n), m: (v - 1n) / base };
    }

    function N_to_ClockTuple(N) {
      if (typeof N === "number" && !Number.isSafeInteger(N)) {
        throw new RangeError("N is te groot voor Number. Geef een BigInt.");
      }
      let rest = BigInt(N);
      if (rest < 0n) throw new Error("N >= 0");
      const out = [];
      for (const unit of SMALL_TO_LARGE) {
        const base = BASES[unit];
        if (base === null) out.push(Number(rest + 1n));
        else { const { position, m } = spiral(rest + 1n, base); out.push(position); rest = m; }
      }
      return out.reverse();
    }

    // Tuple opbouwen
    const tupleEl = document.getElementById("tuple");
    for (const u of UNITS) {
        const d = document.createElement("div");
        d.innerHTML = `<div class="val" data-u="${u}">1</div><div class="lbl">${u}</div>`;
        tupleEl.appendChild(d);
    }

    let currentSystem = 7;
    let currentDayIndex = 0;

    function updateBijection(dayIndex) {
        currentDayIndex = dayIndex;
        const N = BigInt(dayIndex) * 86400000n; // dag naar ms
        const t = N_to_ClockTuple(N);
        const hour = t[6], minute = t[7], second = t[8];
        const pm = Math.floor((hour - 1) / 12);
        document.getElementById("paper-m").textContent = pm;
        document.getElementById("paper-m-sub").textContent =
            pm === 0 ? "0 rondjes van 12 uur" : `${pm} rondje${pm > 1 ? "s" : ""} van 12 uur`;
        document.getElementById("hour-pos").textContent = hour;
        tupleEl.querySelectorAll(".val").forEach(e =>
            e.textContent = t[UNITS.indexOf(e.dataset.u)]);

        if (spiralObj) {
            const { position, m } = spiral(N + 1n, currentSystem);
            spiralObj.setQ(currentSystem);
            spiralObj.setCurrent(Number(m), position);
            document.getElementById("spiral-info").innerHTML =
                `<span>Positie <b>${position}</b></span>` +
                `<span>m = <b>${m}</b></span>` +
                `<span>p = m·q + 1 = <b>${Number(m) * currentSystem + 1}</b></span>`;
        }
    }

    /* ================= SPIRAAL ================= */
    class Spiral {
      constructor(canvas, q = 7) {
        this.c = canvas;
        this.ctx = canvas.getContext("2d");
        this.q = q;
        this.rotation = 0;
        this.tilt = 0.35;
        this.autoRotate = true;
        this.dragging = false;
        this.lastX = 0;
        this.currentM = 0;
        this.currentPos = 1;
        this.dpr = window.devicePixelRatio || 1;
        this.resize();
        this.setupEvents();
        this.loop();
      }
      resize() {
        const r = this.c.getBoundingClientRect();
        this.c.width = r.width * this.dpr;
        this.c.height = r.height * this.dpr;
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }
      setupEvents() {
        this.c.addEventListener("pointerdown", e => { this.dragging = true; this.lastX = e.clientX; });
        window.addEventListener("pointermove", e => {
          if (!this.dragging) return;
          this.rotation += (e.clientX - this.lastX) * 0.01;
          this.lastX = e.clientX;
        });
        window.addEventListener("pointerup", () => { this.dragging = false; });
        window.addEventListener("resize", () => this.resize());
      }
      project(x, y, z) {
        const w = this.c.width / this.dpr, h = this.c.height / this.dpr;
        const ca = Math.cos(this.rotation), sa = Math.sin(this.rotation);
        const x1 = x * ca - z * sa;
        const z1 = x * sa + z * ca;
        const ct = Math.cos(this.tilt), st = Math.sin(this.tilt);
        const y1 = y * ct - z1 * st;
        const z2 = y * st + z1 * ct;
        const fov = 400;
        const scale = fov / (fov + z2);
        return { x: w/2 + x1*scale*55, y: h/2 - y1*scale*22, z: z2, scale };
      }
      setQ(q) { this.q = q; }
      setCurrent(m, pos) { this.currentM = m; this.currentPos = pos; }
      draw() {
        const w = this.c.width / this.dpr, h = this.c.height / this.dpr;
        this.ctx.clearRect(0, 0, w, h);
        const minM = Math.max(0, this.currentM - 5);
        const maxM = this.currentM + 5;
        const pts = [];
        for (let m = minM; m <= maxM; m++) {
          for (let p = 1; p <= this.q; p++) {
            const t = (p - 1) / this.q * Math.PI * 2;
            pts.push({ m, p, ...this.project(Math.cos(t), m, Math.sin(t)) });
          }
        }
        pts.sort((a, b) => b.z - a.z);
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i+1];
          if (Math.abs(a.m - b.m) > 1) continue;
          if (Math.abs(a.p - b.p) > 1) continue;
          const dist = Math.abs(a.m - this.currentM);
          const alpha = Math.max(0.08, 1 - dist / 6);
          const isCur = a.m === this.currentM;
          this.ctx.beginPath();
          this.ctx.moveTo(a.x, a.y);
          this.ctx.lineTo(b.x, b.y);
          this.ctx.strokeStyle = isCur ? `rgba(244,197,66,${alpha})` : `rgba(77,208,225,${alpha*0.5})`;
          this.ctx.lineWidth = isCur ? 2.2 : 1;
          this.ctx.stroke();
        }
        const t = (this.currentPos - 1) / this.q * Math.PI * 2;
        const cur = this.project(Math.cos(t), this.currentM, Math.sin(t));
        this.ctx.beginPath();
        this.ctx.arc(cur.x, cur.y, 7, 0, Math.PI * 2);
        this.ctx.fillStyle = "#f4c542";
        this.ctx.shadowColor = "#f4c542";
        this.ctx.shadowBlur = 16;
        this.ctx.fill();
        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = "rgba(122,130,168,0.9)";
        this.ctx.font = "11px -apple-system, sans-serif";
        this.ctx.textAlign = "left";
        this.ctx.fillText(`m = ${this.currentM}`, 12, 20);
        if (this.autoRotate && !this.dragging) this.rotation += 0.004;
      }
      loop() { this.draw(); requestAnimationFrame(() => this.loop()); }
    }

    let spiralObj = null;

    // Initialiseer bijectie zodra het script geladen is
    function initBijection() {
        const canvas = document.getElementById("spiral-canvas");
        if (!canvas) return;
        spiralObj = new Spiral(canvas, currentSystem);
        
        document.getElementById("spiral-system").addEventListener("change", e => {
            currentSystem = parseInt(e.target.value, 10);
            updateBijection(currentDayIndex);
        });
        
        document.getElementById("spiral-toggle").addEventListener("click", e => {
            spiralObj.autoRotate = !spiralObj.autoRotate;
            e.target.textContent = spiralObj.autoRotate ? "⏸ Rotatie" : "▶ Rotatie";
        });
        
        document.getElementById("bijection-slider").addEventListener("input", e => {
            updateBijection(parseInt(e.target.value, 10));
        });
        
        // Start met dag 0
        updateBijection(0);
    }

    // Roep initBijection aan na laden
    window.addEventListener('load', initBijection);

    /* ================= 100-JARIGE CYCLUS ================= */
    const cycleGrid = document.getElementById('cycleGrid');
    for (let year = 2000; year <= 2099; year++) {
        const yearBox = document.createElement('div');
        yearBox.className = 'year-box';
        yearBox.textContent = year;
        cycleGrid.appendChild(yearBox);
    }

    /* ================= STOPWATCH ================= */
    let swInterval = null;
    let swTime = 0;
    let swRunning = false;

    function formatStopwatch(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const hundredths = Math.floor((ms % 1000) / 10);
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(hundredths).padStart(2, '0')}`;
    }

    function startStopwatch() {
        if (swRunning) return;
        swRunning = true;
        document.getElementById('swStart').disabled = true;
        document.getElementById('swStop').disabled = false;
        const startTime = Date.now() - swTime;
        swInterval = setInterval(() => {
            swTime = Date.now() - startTime;
            document.getElementById('swDisplay').textContent = formatStopwatch(swTime);
        }, 10);
    }

    function stopStopwatch() {
        swRunning = false;
        clearInterval(swInterval);
        document.getElementById('swStart').disabled = false;
        document.getElementById('swStop').disabled = true;
    }

    function resetStopwatch() {
        stopStopwatch();
        swTime = 0;
        document.getElementById('swDisplay').textContent = formatStopwatch(0);
    }

    /* ================= AGENDA ================= */
    let currentDate = new Date();
    let selectedDate = new Date();
    let events = JSON.parse(localStorage.getItem('agendaEvents')) || {};

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
        document.getElementById('monthYearDisplay').textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const dayNames = ["Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"];
        dayNames.forEach(day => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = day;
            grid.appendChild(el);
        });

        for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const el = document.createElement('div');
            el.className = 'calendar-day';
            el.textContent = day;
            
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear()) {
                el.classList.add('today');
            }
            if (dateStr === selectedDate.toISOString().split('T')[0]) {
                el.classList.add('selected');
            }

            el.onclick = () => {
                selectedDate = new Date(year, month, day);
                renderCalendar();
                renderEvents();
            };
            grid.appendChild(el);
        }
    }

    function renderEvents() {
        const dateStr = selectedDate.toISOString().split('T')[0];
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        
        const displayStr = selectedDate.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('selectedDateDisplay').textContent = displayStr;

        if (events[dateStr] && events[dateStr].length > 0) {
            events[dateStr].forEach((eventText, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${eventText}</span> <button onclick="removeEvent('${dateStr}', ${index})">X</button>`;
                list.appendChild(li);
            });
        } else {
            list.innerHTML = '<li style="color: #666; background: transparent; justify-content: center; border: none;">Geen afspraken</li>';
        }
    }

    function addEvent() {
        const input = document.getElementById('eventInput');
        const text = input.value.trim();
        if (!text) return;
        const dateStr = selectedDate.toISOString().split('T')[0];
        if (!events[dateStr]) events[dateStr] = [];
        events[dateStr].push(text);
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        input.value = '';
        renderEvents();
    }

    function removeEvent(dateStr, index) {
        events[dateStr].splice(index, 1);
        if (events[dateStr].length === 0) delete events[dateStr];
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        renderEvents();
    }

    renderCalendar();
    renderEvents();

    /* ================= KLUIS ================= */
    let vaultItems = JSON.parse(localStorage.getItem('vaultData')) || [];

    function renderVault() {
        const list = document.getElementById('vaultList');
        list.innerHTML = '';
        
        if (vaultItems.length === 0) {
            list.innerHTML = '<li style="text-align: center; color: #666; background: transparent; border: none;">De kluis is leeg.</li>';
            return;
        }

        vaultItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'vault-item';
            const isVisible = item.visible ? item.secret : '••••••••••••';
            
            li.innerHTML = `
                <div class="vault-info">
                    <span class="vault-title">${item.title}</span>
                    <span class="vault-secret" id="secret-${index}">${isVisible}</span>
                </div>
                <div class="vault-actions">
                    <button onclick="toggleSecret(${index})">${item.visible ? 'Verberg' : 'Toon'}</button>
                    <button onclick="copySecret(${index})">Kopieer</button>
                    <button onclick="deleteVaultItem(${index})" style="color: var(--highlight); border-color: var(--highlight);">Verwijder</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function addVaultItem() {
        const titleInput = document.getElementById('vaultTitle');
        const secretInput = document.getElementById('vaultSecret');
        const title = titleInput.value.trim();
        const secret = secretInput.value.trim();
        
        if (!title || !secret) {
            alert('Vul zowel een titel als een geheim in.');
            return;
        }
        vaultItems.push({ title, secret, visible: false });
        localStorage.setItem('vaultData', JSON.stringify(vaultItems));
        titleInput.value = '';
        secretInput.value = '';
        renderVault();
    }

    function toggleSecret(index) {
        vaultItems[index].visible = !vaultItems[index].visible;
        renderVault();
    }

    function copySecret(index) {
        navigator.clipboard.writeText(vaultItems[index].secret).then(() => {
            alert('Geheim gekopieerd naar klembord!');
        });
    }

    function deleteVaultItem(index) {
        if(confirm('Weet je zeker dat je dit item wilt verwijderen?')) {
            vaultItems.splice(index, 1);
            localStorage.setItem('vaultData', JSON.stringify(vaultItems));
            renderVault();
        }
    }

    renderVault();
</script>
