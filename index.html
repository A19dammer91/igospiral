<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definitieve Applicatie</title>
<style>
    :root {
        --bg-color: #161d30;
        --panel-bg: #1c2438;
        --border-color: #3b4b6e;
        --text-color: #c2cbe0;
        --accent-color: #fbc531;
        --highlight: #e84118;
        --success: #4cd137;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    nav {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        background: var(--panel-bg);
        padding: 10px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        flex-wrap: wrap;
        justify-content: center;
    }

    .tab-btn {
        background: transparent;
        border: none;
        color: var(--text-color);
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .tab-btn:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
        background: var(--accent-color);
        color: var(--bg-color);
        font-weight: bold;
    }

    .tab-content {
        display: none;
        width: 100%;
        max-width: 900px;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.4s;
    }

    .tab-content.active {
        display: flex;
        flex-direction: column;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ================= KLOK ================= */
    .clock-container {
        width: 80vmin;
        height: 80vmin;
        max-width: 500px;
        max-height: 500px;
        border-radius: 50%;
        background: var(--panel-bg);
        border: 2px solid var(--border-color);
        position: relative;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.3);
        margin-top: 20px;
    }

    .center-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4%;
        height: 4%;
        background-color: var(--accent-color);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    .number {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        text-align: center;
        font-size: 4vmin;
        font-weight: 500;
        transform-origin: center center;
        pointer-events: none;
    }

    .number span { display: inline-block; padding-top: 5%; }
    .number div { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
    
    .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 10px; z-index: 5; }
    .hour-hand { width: 1.5%; height: 25%; background-color: var(--accent-color); }
    .minute-hand { width: 1%; height: 38%; background-color: var(--accent-color); }
    .second-hand { width: 0.5%; height: 42%; background-color: var(--highlight); z-index: 6; }
    .inner-ring { position: absolute; top: 5%; left: 5%; width: 90%; height: 90%; border-radius: 50%; border: 1px solid rgba(59, 75, 110, 0.3); }

    /* ================= 100-JARIGE CYCLUS ================= */
    .cycle-container { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; text-align: center; }
    .cycle-container h2 { margin-bottom: 20px; color: var(--accent-color); }
    .cycle-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .year-box { background: rgba(255, 255, 255, 0.05); padding: 10px 5px; border-radius: 4px; font-size: 0.9rem; border: 1px solid transparent; }
    .year-box:hover { background: rgba(251, 197, 49, 0.2); border-color: var(--accent-color); }

    /* ================= STOPWATCH & BEEP ================= */
    .action-panel { background: var(--panel-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; width: 100%; max-width: 450px; }
    .stopwatch-display { font-size: 4rem; font-weight: bold; color: var(--accent-color); font-variant-numeric: tabular-nums; margin-bottom: 20px; font-family: monospace; }
    .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .action-btn { background: var(--accent-color); color: var(--bg-color); border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    .action-btn:hover { opacity: 0.8; }
    .action-btn.reset { background: var(--highlight); color: white; }
    .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .input-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .input-group input { padding: 12px; font-size: 1.2rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); width: 120px; text-align: center; }
    .beep-status { font-size: 1.5rem; font-weight: bold; margin-top: 20px; color: var(--accent-color); min-height: 30px; }

    /* ================= AGENDA ================= */
    .agenda-container { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; display: flex; gap: 30px; flex-wrap: wrap; }
    .calendar-section { flex: 1; min-width: 300px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .calendar-header h2 { color: var(--accent-color); margin: 0; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .day-name { font-weight: bold; color: var(--border-color); padding: 10px 0; }
    .calendar-day { padding: 15px 5px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
    .calendar-day:hover { background: rgba(251, 197, 49, 0.1); }
    .calendar-day.selected { background: var(--accent-color); color: var(--bg-color); font-weight: bold; border-color: var(--accent-color); }
    .calendar-day.today { border-color: var(--highlight); }
    
    .events-section { flex: 1; min-width: 300px; border-left: 1px solid var(--border-color); padding-left: 30px; }
    .events-section h3 { margin-bottom: 15px; color: var(--text-color); }
    .event-list { list-style: none; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
    .event-list li { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .event-list li button { background: var(--highlight); border: none; color: white; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    .event-input-group { display: flex; gap: 10px; }
    .event-input-group input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }

    /* ================= KLUIS ================= */
    .vault-container { background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 600px; }
    .vault-container h2 { color: var(--accent-color); margin-bottom: 20px; text-align: center; }
    .vault-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; }
    .vault-form input { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); width: 100%; }
    .vault-list { list-style: none; }
    .vault-item { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent-color); }
    .vault-info { display: flex; flex-direction: column; gap: 5px; }
    .vault-title { font-weight: bold; color: var(--accent-color); }
    .vault-secret { font-family: monospace; letter-spacing: 2px; color: var(--text-color); }
    .vault-actions { display: flex; gap: 10px; }
    .vault-actions button { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .vault-actions button:hover { background: var(--border-color); }
</style>
</head>
<body>

    <nav>
        <button class="tab-btn active" onclick="openTab(event, 'clock-tab')">Klok</button>
        <button class="tab-btn" onclick="openTab(event, 'cycle-tab')">100-Jarige Cyclus</button>
        <button class="tab-btn" onclick="openTab(event, 'stopwatch-tab')">Stopwatch</button>
        <button class="tab-btn" onclick="openTab(event, 'beep-tab')">Biepsectie</button>
        <button class="tab-btn" onclick="openTab(event, 'agenda-tab')">Agenda</button>
        <button class="tab-btn" onclick="openTab(event, 'vault-tab')">Kluis</button>
    </nav>

    <!-- TAB 1: KLOK -->
    <section id="clock-tab" class="tab-content active">
        <div class="clock-container">
            <div class="inner-ring"></div>
            <div class="center-dot"></div>
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
    </section>

    <!-- TAB 2: 100-JARIGE CYCLUS -->
    <section id="cycle-tab" class="tab-content">
        <div class="cycle-container">
            <h2>100-Jarige Cyclus (2000 - 2099)</h2>
            <div class="cycle-grid" id="cycleGrid"></div>
        </div>
    </section>

    <!-- TAB 3: STOPWATCH -->
    <section id="stopwatch-tab" class="tab-content">
        <div class="action-panel">
            <div class="stopwatch-display" id="swDisplay">00:00:00</div>
            <div class="btn-group">
                <button class="action-btn" id="swStart" onclick="startStopwatch()">Start</button>
                <button class="action-btn" id="swStop" onclick="stopStopwatch()" disabled>Stop</button>
                <button class="action-btn reset" onclick="resetStopwatch()">Reset</button>
            </div>
        </div>
    </section>

    <!-- TAB 4: BIEPSECTIE -->
    <section id="beep-tab" class="tab-content">
        <div class="action-panel">
            <h2 style="margin-bottom: 20px; color: var(--accent-color);">Biepsectie</h2>
            <div class="input-group">
                <input type="number" id="beepTime" value="5" min="1">
                <button class="action-btn" onclick="startBeep()">Start Timer</button>
            </div>
            <div class="beep-status" id="beepStatus">Gereed.</div>
        </div>
    </section>

    <!-- TAB 5: AGENDA -->
    <section id="agenda-tab" class="tab-content">
        <div class="agenda-container">
            <div class="calendar-section">
                <div class="calendar-header">
                    <h2 id="monthYearDisplay">Maand</h2>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Kalender wordt via JS gegenereerd -->
                </div>
            </div>
            <div class="events-section">
                <h3 id="selectedDateDisplay">Selecteer een dag</h3>
                <ul class="event-list" id="eventList"></ul>
                <div class="event-input-group">
                    <input type="text" id="eventInput" placeholder="Nieuwe afspraak...">
                    <button class="action-btn" onclick="addEvent()" style="padding: 10px 15px;">+</button>
                </div>
            </div>
        </div>
    </section>

    <!-- TAB 6: KLUIS -->
    <section id="vault-tab" class="tab-content">
        <div class="vault-container">
            <h2>Beveiligde Kluis</h2>
            <div class="vault-form">
                <input type="text" id="vaultTitle" placeholder="Titel (bijv. Gmail, Crypto Wallet)">
                <input type="password" id="vaultSecret" placeholder="Wachtwoord / Cryptografische Sleutel">
                <button class="action-btn" onclick="addVaultItem()">Opslaan in Kluis</button>
            </div>
            <ul class="vault-list" id="vaultList">
                <!-- Kluis items worden hier weergegeven -->
            </ul>
        </div>
    </section>

<script>
    /* ================= TAB LOGICA ================= */
    function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        
        document.getElementById(tabName).style.display = "flex";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    /* ================= KLOK LOGICA ================= */
    const clockContainer = document.querySelector('.clock-container');
    for (let i = 1; i <= 12; i++) {
        const numberDiv = document.createElement('div');
        numberDiv.className = 'number';
        numberDiv.style.transform = `rotate(${i * 30}deg)`;
        const innerDiv = document.createElement('div');
        innerDiv.style.transform = `rotate(${-i * 30}deg)`;
        const span = document.createElement('span');
        span.textContent = i;
        innerDiv.appendChild(span);
        numberDiv.appendChild(innerDiv);
        clockContainer.appendChild(numberDiv);
    }

    function updateClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();
        const secondDegrees = (seconds / 60) * 360;
        const minuteDegrees = ((minutes + seconds / 60) / 60) * 360;
        const hourDegrees = ((hours % 12 + minutes / 60) / 12) * 360;
        document.getElementById('second').style.transform = `translateX(-50%) rotate(${secondDegrees}deg)`;
        document.getElementById('minute').style.transform = `translateX(-50%) rotate(${minuteDegrees}deg)`;
        document.getElementById('hour').style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ================= 100-JARIGE CYCLUS ================= */
    const cycleGrid = document.getElementById('cycleGrid');
    for (let year = 2000; year <= 2099; year++) {
        const yearBox = document.createElement('div');
        yearBox.className = 'year-box';
        yearBox.textContent = year;
        cycleGrid.appendChild(yearBox);
    }

    /* ================= STOPWATCH ================= */
    let swInterval = null;
    let swTime = 0;
    let swRunning = false;

    function formatStopwatch(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const hundredths = Math.floor((ms % 1000) / 10);
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}:${String(hundredths).padStart(2, '0')}`;
    }

    function startStopwatch() {
        if (swRunning) return;
        swRunning = true;
        document.getElementById('swStart').disabled = true;
        document.getElementById('swStop').disabled = false;
        const startTime = Date.now() - swTime;
        swInterval = setInterval(() => {
            swTime = Date.now() - startTime;
            document.getElementById('swDisplay').textContent = formatStopwatch(swTime);
        }, 10);
    }

    function stopStopwatch() {
        swRunning = false;
        clearInterval(swInterval);
        document.getElementById('swStart').disabled = false;
        document.getElementById('swStop').disabled = true;
    }

    function resetStopwatch() {
        stopStopwatch();
        swTime = 0;
        document.getElementById('swDisplay').textContent = formatStopwatch(0);
    }

    /* ================= BIEPSECTIE ================= */
    let beepTimeout = null;
    let audioCtx = null;

    function playBeep() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    }

    function startBeep() {
        const timeInput = document.getElementById('beepTime').value;
        const status = document.getElementById('beepStatus');
        const seconds = parseInt(timeInput);
        if (isNaN(seconds) || seconds < 1) {
            status.textContent = "Voer een geldig getal in!";
            return;
        }
        if (beepTimeout) clearTimeout(beepTimeout);
        status.textContent = `Timer gestart voor ${seconds} seconden...`;
        beepTimeout = setTimeout(() => {
            status.textContent = "BIEP! Tijd is om.";
            playBeep();
            setTimeout(playBeep, 600);
            setTimeout(playBeep, 1200);
        }, seconds * 1000);
    }

    /* ================= AGENDA ================= */
    let currentDate = new Date();
    let selectedDate = new Date();
    let events = JSON.parse(localStorage.getItem('agendaEvents')) || {};

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        const monthNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
        document.getElementById('monthYearDisplay').textContent = `${monthNames[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const dayNames = ["Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"];
        dayNames.forEach(day => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.textContent = day;
            grid.appendChild(el);
        });

        // Lege cellen voor de eerste dag
        for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        // Dagen van de maand
        for (let day = 1; day <= daysInMonth; day++) {
            const el = document.createElement('div');
            el.className = 'calendar-day';
            el.textContent = day;
            
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (day === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear()) {
                el.classList.add('today');
            }

            if (dateStr === selectedDate.toISOString().split('T')[0]) {
                el.classList.add('selected');
            }

            el.onclick = () => {
                selectedDate = new Date(year, month, day);
                renderCalendar();
                renderEvents();
            };
            grid.appendChild(el);
        }
    }

    function renderEvents() {
        const dateStr = selectedDate.toISOString().split('T')[0];
        const list = document.getElementById('eventList');
        list.innerHTML = '';
        
        const displayStr = selectedDate.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('selectedDateDisplay').textContent = displayStr;

        if (events[dateStr] && events[dateStr].length > 0) {
            events[dateStr].forEach((eventText, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${eventText}</span> <button onclick="removeEvent('${dateStr}', ${index})">X</button>`;
                list.appendChild(li);
            });
        } else {
            list.innerHTML = '<li style="color: #666; background: transparent; justify-content: center;">Geen afspraken</li>';
        }
    }

    function addEvent() {
        const input = document.getElementById('eventInput');
        const text = input.value.trim();
        if (!text) return;

        const dateStr = selectedDate.toISOString().split('T')[0];
        if (!events[dateStr]) events[dateStr] = [];
        
        events[dateStr].push(text);
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        input.value = '';
        renderEvents();
    }

    function removeEvent(dateStr, index) {
        events[dateStr].splice(index, 1);
        if (events[dateStr].length === 0) delete events[dateStr];
        localStorage.setItem('agendaEvents', JSON.stringify(events));
        renderEvents();
    }

    renderCalendar();
    renderEvents();

    /* ================= KLUIS ================= */
    let vaultItems = JSON.parse(localStorage.getItem('vaultData')) || [];

    function renderVault() {
        const list = document.getElementById('vaultList');
        list.innerHTML = '';
        
        if (vaultItems.length === 0) {
            list.innerHTML = '<li style="text-align: center; color: #666; background: transparent; border: none;">De kluis is leeg.</li>';
            return;
        }

        vaultItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'vault-item';
            
            const isVisible = item.visible ? item.secret : '••••••••••••';
            
            li.innerHTML = `
                <div class="vault-info">
                    <span class="vault-title">${item.title}</span>
                    <span class="vault-secret" id="secret-${index}">${isVisible}</span>
                </div>
                <div class="vault-actions">
                    <button onclick="toggleSecret(${index})">${item.visible ? 'Verberg' : 'Toon'}</button>
                    <button onclick="copySecret(${index})">Kopieer</button>
                    <button onclick="deleteVaultItem(${index})" style="color: var(--highlight); border-color: var(--highlight);">Verwijder</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    function addVaultItem() {
        const titleInput = document.getElementById('vaultTitle');
        const secretInput = document.getElementById('vaultSecret');
        
        const title = titleInput.value.trim();
        const secret = secretInput.value.trim();
        
        if (!title || !secret) {
            alert('Vul zowel een titel als een geheim in.');
            return;
        }

        vaultItems.push({ title, secret, visible: false });
        localStorage.setItem('vaultData', JSON.stringify(vaultItems));
        
        titleInput.value = '';
        secretInput.value = '';
        renderVault();
    }

    function toggleSecret(index) {
        vaultItems[index].visible = !vaultItems[index].visible;
        renderVault();
    }

    function copySecret(index) {
        navigator.clipboard.writeText(vaultItems[index].secret).then(() => {
            alert('Geheim gekopieerd naar klembord!');
        });
    }

    function deleteVaultItem(index) {
        if(confirm('Weet je zeker dat je dit item wilt verwijderen?')) {
            vaultItems.splice(index, 1);
            localStorage.setItem('vaultData', JSON.stringify(vaultItems));
            renderVault();
        }
    }

    renderVault();
</script>

</body>
</html>
